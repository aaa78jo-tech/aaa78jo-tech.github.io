<style>
html,body{margin:0;padding:0;background:#0A1C29}

:root{
  --bg:#0A1C29; --surface:#12304A; --surface-2:#1B4165; --line:#2E6389;
  --text:#F2F9FD; --muted:#B4D0E2;
  --cat:#FFB964; --an:#5AD3C8;
  --good:#6EE7A0; --warn:#FFCE4F; --bad:#FF8B8B; --blue:#7CC4F5;
  --shell:540px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#root{
  direction:rtl;
  font-family:'Cairo','Noto Kufi Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; padding-bottom:84px;
  font-size:16px; line-height:1.75;
  overflow-x:hidden;                 /* never overflow the page */
  -webkit-font-smoothing:antialiased;
}
/* ---- centered phone-width column: fixes desktop stretching ---- */
.shell{max-width:var(--shell);margin:0 auto;width:100%}

.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;direction:ltr;font-weight:600}
span.num,b.num{display:inline-block}
td.num,th.num{display:table-cell}

.hdr{background:linear-gradient(160deg,#17415F,#0A1C29);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;padding:16px 0 13px}
.hdr h1{margin:0;font-size:19px;font-weight:700}
.hdr p{margin:3px 0 0;font-size:13px;color:var(--muted);font-weight:500}
.hdr .shell{padding:0 16px}html[dir="ltr"] .hdr .shell{padding-right:124px;direction:ltr;text-align:left}html[dir="rtl"] .hdr .shell{padding-left:124px}

.wrap{padding:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:13px}
.card h2{margin:0 0 12px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 .tag{font-size:12px;color:var(--muted);font-weight:500;margin-right:auto}

label.f{display:block;font-size:13px;color:var(--muted);margin:0 0 5px;font-weight:500}
input,select,textarea{width:100%;background:#081722;color:var(--text);border:1.5px solid var(--line);
  border-radius:10px;padding:11px;font-size:16px;font-family:inherit;font-weight:500}
input:focus,select:focus{outline:2.5px solid var(--blue);outline-offset:-1px}
input.mono{font-family:'IBM Plex Mono',monospace;direction:ltr;text-align:center;font-weight:600}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:11px;
  border:0;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;background:var(--blue);color:#052032}
.btn:active{filter:brightness(.88)}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text);font-weight:600}
.btn.amber{background:var(--cat);color:#3A2408}
.btn.sm{padding:9px 12px;font-size:14px;width:auto;min-width:0;overflow-wrap:anywhere;word-break:break-word;white-space:normal;line-height:1.15}

.fulcrum{position:relative;height:78px;margin-bottom:8px}
.beam{position:absolute;top:28px;left:8%;right:8%;height:8px;border-radius:4px;
  background:linear-gradient(90deg,var(--an),#2C6E82 45%,#8A6A3C 55%,var(--cat));
  transform-origin:center;transition:transform .5s cubic-bezier(.34,1.3,.64,1)}
.beam::before,.beam::after{content:'';position:absolute;top:-5px;width:18px;height:18px;border-radius:50%}
.beam::before{right:-9px;background:var(--cat)}
.beam::after{left:-9px;background:var(--an)}
.pivot{position:absolute;top:34px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:30px solid var(--surface-2)}
.pivot-line{position:absolute;top:64px;left:22%;right:22%;height:2px;background:var(--line);border-radius:2px}
.beam-lbl{position:absolute;top:0;font-size:12px;color:var(--muted);font-weight:600}
.beam-lbl.r{right:2px;text-align:right}.beam-lbl.l{left:2px;text-align:left}
.bar{height:10px;border-radius:5px;background:#081722;overflow:hidden;display:flex;margin:6px 0}
.bar i{display:block;height:100%}
.verdict{text-align:center;padding:11px;border-radius:10px;font-weight:700;font-size:15px;margin-top:9px}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px;table-layout:auto} .tight td,.tight th{padding:8px 3px;font-size:13px} .tight .num{font-size:12.5px} .tight td .chip{padding:2px 6px;font-size:12px} .tight .name,.tight th.name,.tight td.name{min-width:30px;width:34px;max-width:34px;text-align:center;font-size:13px}
th{font-size:12.5px;color:var(--muted);font-weight:600;padding:7px 5px;text-align:center;
  border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:9px 5px;text-align:center;border-bottom:1px solid rgba(46,99,137,.45);font-weight:500;white-space:nowrap}
td.name,th.name{text-align:right;font-weight:600;font-size:14px;white-space:normal;min-width:104px;max-width:150px}

.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700}
.chip.ok{background:rgba(110,231,160,.18);color:var(--good)}
.chip.hi{background:rgba(255,139,139,.18);color:var(--bad)}
.chip.lo{background:rgba(255,206,79,.18);color:var(--warn)}

.frow{padding:11px 0;border-bottom:1px solid rgba(46,99,137,.45)}
.frow:last-of-type{border-bottom:0}
.frow .top{display:flex;align-items:center;gap:9px}
.frow .fn{flex:1;min-width:0}
.frow .fn b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .fn span{font-size:12px;color:var(--muted);font-weight:500}
.frow input{width:86px;flex:none;padding:9px 4px}
.x{background:none;border:0;color:var(--muted);font-size:22px;padding:0 6px;cursor:pointer;flex:none}
.recalc{display:flex;align-items:center;gap:7px;margin-top:8px;padding-right:2px}
.recalc select{width:auto;flex:1;padding:7px 9px;font-size:13.5px}
.recalc button{background:var(--surface-2);border:1.5px solid var(--line);color:var(--blue);
  border-radius:9px;padding:7px 11px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.recalc button:active{filter:brightness(1.25)}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(8,23,34,.97);
  backdrop-filter:blur(12px);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{display:grid;grid-template-columns:repeat(4,1fr);max-width:var(--shell);margin:0 auto}
.nav button{background:none;border:0;color:var(--muted);font-family:inherit;padding:10px 2px 12px;
  font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  border-top:2.5px solid transparent}
.nav button.on{color:var(--blue);border-top-color:var(--blue)}
.nav svg{width:22px;height:22px;stroke-width:1.8}

.drop{border:2px dashed var(--line);border-radius:14px;padding:26px 14px;text-align:center;background:rgba(27,65,101,.45)}
.drop svg{width:38px;height:38px;color:var(--blue);margin-bottom:9px}
.drop p{margin:0;font-size:16px;font-weight:700}
.drop small{color:var(--muted);font-size:13px;font-weight:500}

.note{font-size:14px;color:var(--muted);line-height:1.8;font-weight:500}
.warnbox{background:rgba(255,206,79,.10);border:1.5px solid rgba(255,206,79,.38);border-radius:10px;
  padding:11px 13px;font-size:14px;color:#FFE59B;line-height:1.75;font-weight:500}
.okbox{background:rgba(110,231,160,.10);border:1.5px solid rgba(110,231,160,.32);border-radius:10px;
  padding:11px 13px;font-size:14px;color:#B7F0CE;line-height:1.75;font-weight:500}
.errbox{background:rgba(255,139,139,.10);border:1.5px solid rgba(255,139,139,.38);border-radius:10px;
  padding:11px 13px;font-size:14px;color:#FFC2C2;line-height:1.75;font-weight:500}
.errbox code{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#FFA0A0;direction:ltr;display:block;
  margin-top:6px;word-break:break-all;background:rgba(0,0,0,.3);padding:6px;border-radius:6px;text-align:left}

.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.gcell label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px;font-weight:600}
.gcell input{padding:9px;font-size:15px}

.pulse{animation:pl 1.4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


.nav5{grid-template-columns:repeat(5,1fr)!important}
.nav5 button{font-size:10.5px;padding:9px 1px 11px}
.btn.sm{padding:8px 13px;font-size:14px}

.nav5{grid-template-columns:repeat(5,1fr)!important}
.nav6{grid-template-columns:repeat(6,1fr)!important}
.nav6 button{font-size:9.5px;padding:9px 0 11px;gap:3px}
.nav6 svg{width:20px;height:20px}
.btn.sm{padding:8px 13px;font-size:14px}

.nav5{grid-template-columns:repeat(5,1fr)!important}
.nav6{grid-template-columns:repeat(6,1fr)!important}
.nav7{grid-template-columns:repeat(7,1fr)!important}
.nav7 button{font-size:8.5px;padding:8px 0 10px;gap:2px}
.nav7 svg{width:18px;height:18px}.nav8{grid-template-columns:repeat(8,1fr)!important}.nav8 button{font-size:8px;padding:8px 0 10px;gap:2px}.nav8 svg{width:17px;height:17px}
.btn.sm.ghost{padding:7px 10px;font-size:13px}
/* LTR languages: the React core was authored RTL-first; <html dir> is set by the app */
html[dir="ltr"] #root{direction:ltr;text-align:left}
html[dir="ltr"] td.name,html[dir="ltr"] th.name{text-align:left}
html[dir="ltr"] .card h2 .tag{margin-right:0;margin-left:auto}
html[dir="ltr"] .recalc{padding-right:0;padding-left:2px}

 sin encharcar raíces. Recorta a menudo las puntas verdes, nunca la madera vieja. Luz intensa 12–14 h.",zh:"氮少一些，精油和香味更浓。使用排水良好的基质，根部不要长期泡水。经常剪绿色嫩尖，不要剪老木。强光 12–14 小时。",hi:"कम नाइट्रोजन = ज़्यादा तेल और खुशबू। अच्छी जल-निकासी वाला माध्यम रखें, जड़ें हमेशा गीली न रहें। हरी टहनियाँ नियमित काटें, पुरानी लकड़ी नहीं। तेज़ रोशनी 12–14 घंटे।",pt:"Menos nitrogênio = mais óleos e sabor. Substrato bem drenado, raízes nunca encharcadas. Pode as pontas verdes com frequência, nunca a madeira velha. Luz forte 12–14 h.",nl:"Minder stikstof = sterkere oliën en smaak. Gebruik een goed drainerend substraat, wortels nooit doorweekt. Knip vaak de groene toppen, nooit in oud hout. Veel licht 12–14 u."}},{herb:1,hk:"basil",key:{ar:"ريحان",en:"Basil",fr:"Basilic",es:"Albahaca",zh:"罗勒",hi:"बेसिल (तुलसी)",pt:"Manjericão",nl:"Basilicum"},gen:{N:136,P:38,K:213,Ca:136,Mg:38,S:73,Fe:3,Mn:.5,Zn:.3,Cu:.05,B:.3,Mo:.05},veg:{N:160,P:40,K:195,Ca:142,Mg:40,S:45,Fe:3,Mn:.5,Zn:.3,Cu:.05,B:.3,Mo:.05},ec:"1.2–1.8",ph:"5.5–6.5",ref:"Resh 2013 · Cornell CEA",tip:{ar:"حسّاس لنقص الحديد إذا ارتفع pH فوق 6.5. اقطف القمة فوق عقدتين وأزل الأزهار لإطالة الإنتاج. حرارة المحلول 20–24°م، ويتضرر تحت 12°م.",en:"Prone to iron deficiency above pH 6.5. Pinch tops above two nodes and remove flowers to keep it producing. Solution 20–24 °C; chilling below 12 °C damages it.",fr:"Sensible à la carence en fer au-dessus de pH 6,5. Pincez au-dessus de deux nœuds et retirez les fleurs. Solution à 20–24 °C ; le froid sous 12 °C l'abîme.",es:"Sensible a la carencia de hierro con pH > 6,5. Despunta sobre dos nudos y quita las flores para alargar la producción. Solución a 20–24 °C; sufre por debajo de 12 °C.",zh:"pH 高于 6.5 易缺铁。在两节上方摘心并摘除花穗以延长采收。营养液 20–24 °C，低于 12 °C 会受冻害。",hi:"pH 6.5 से ऊपर आयरन की कमी जल्दी होती है। दो गाँठों के ऊपर से सिरा तोड़ें और फूल हटाते रहें। घोल 20–24 °C रखें; 12 °C से नीचे नुकसान होता है।",pt:"Sensível à falta de ferro com pH acima de 6,5. Desponte acima de dois nós e retire as flores para produzir por mais tempo. Solução a 20–24 °C; sofre abaixo de 12 °C.",nl:"Gevoelig voor ijzergebrek boven pH 6,5. Top boven twee knopen en verwijder bloemen om te blijven oogsten. Voedingsoplossing 20–24 °C; onder 12 °C raakt hij beschadigd."}},{herb:1,hk:"mint",key:{ar:"نعناع",en:"Mint",fr:"Menthe",es:"Menta",zh:"薄荷",hi:"पुदीना",pt:"Hortelã",nl:"Munt"},gen:{N:180,P:44,K:273,Ca:166,Mg:49,S:82,Fe:2.5,Mn:.5,Zn:.3,Cu:.05,B:.3,Mo:.05},veg:{N:213,P:46,K:254,Ca:172,Mg:51,S:44,Fe:2.5,Mn:.5,Zn:.3,Cu:.05,B:.3,Mo:.05},ec:"1.6–2.2",ph:"5.5–6.5",ref:"Resh 2013 · Cornell CEA",tip:{ar:"نمو قوي يحتاج EC ونيتروجين أعلى من باقي الأعشاب. احصد بالقص كل 3–4 أسابيع. ازرعه في قناة أو حوض منفصل لأن جذوره تزاحم غيرها.",en:"Vigorous: needs higher EC and nitrogen than most herbs. Cut back every 3–4 weeks. Grow it in its own channel or tank — its roots crowd out other plants.",fr:"Vigoureuse : EC et azote plus élevés que les autres aromatiques. Coupez toutes les 3–4 semaines. Cultivez-la à part, ses racines envahissent les voisines.",es:"Vigorosa: necesita más EC y nitrógeno que otras hierbas. Corta cada 3–4 semanas. Cultívala en un canal o depósito aparte: sus raíces invaden a las demás.",zh:"长势旺，需要比其他香草更高的 EC 和氮。每 3–4 周修剪采收一次。单独种在一条管道或一个水箱里，它的根会挤占其他植物。",hi:"तेज़ बढ़त — बाकी जड़ी-बूटियों से ज़्यादा EC और नाइट्रोजन चाहिए। हर 3–4 हफ़्ते में काटें। अलग चैनल या टंकी में उगाएँ, इसकी जड़ें दूसरों को दबा देती हैं।",pt:"Vigorosa: precisa de EC e nitrogênio mais altos que outras ervas. Corte a cada 3–4 semanas. Cultive em canal ou tanque separado — as raízes invadem as outras plantas.",nl:"Groeit sterk: hogere EC en meer stikstof dan de meeste kruiden. Elke 3–4 weken terugknippen. Teel apart in een eigen goot of bak — de wortels verdringen andere planten."}},{herb:1,hk:"parsley",key:{ar:"بقدونس",en:"Parsley",fr:"Persil",es:"Perejil",zh:"欧芹",hi:"पार्सले (अजमोद)",pt:"Salsa",nl:"Peterselie"},gen:{N:148,P:39,K:226,Ca:148,Mg:39,S:75,Fe:2.5,Mn:.5,Zn:.3,Cu:.05,B:.3,Mo:.05},veg:{N:172,P:41,K:208,Ca:154,Mg:41,S:47,Fe:2.5,Mn:.5,Zn:.3,Cu:.05,B:.3,Mo:.05},ec:"1.4–1.8",ph:"5.5–6.5",ref:"Resh 2013 · Cornell CEA",tip:{ar:"إنباته بطيء (2–4 أسابيع): انقع البذور 24 ساعة قبل الزراعة. احصد الأوراق الخارجية واترك القلب ينمو. يتحمل البرودة أكثر من الريحان.",en:"Slow to germinate (2–4 weeks): soak seed for 24 h first. Harvest outer leaves and leave the heart growing. Tolerates cool conditions better than basil.",fr:"Germination lente (2–4 semaines) : faites tremper les graines 24 h. Récoltez les feuilles extérieures et laissez le cœur. Supporte mieux le frais que le basilic.",es:"Germina despacio (2–4 semanas): remoja la semilla 24 h antes. Cosecha las hojas externas y deja crecer el centro. Tolera el fresco mejor que la albahaca.",zh:"发芽慢（2–4 周）：播种前浸种 24 小时。采收外层叶片，保留中心继续生长。比罗勒更耐凉。",hi:"अंकुरण धीमा (2–4 हफ़्ते): बीज को 24 घंटे भिगोकर बोएँ। बाहर की पत्तियाँ तोड़ें, बीच का हिस्सा बढ़ने दें। तुलसी से ज़्यादा ठंड सह लेता है।",pt:"Germina devagar (2–4 semanas): deixe as sementes de molho 24 h. Colha as folhas externas e deixe o miolo crescer. Tolera o frio melhor que o manjericão.",nl:"Kiemt traag (2–4 weken): week het zaad eerst 24 u. Oogst de buitenste bladeren en laat het hart doorgroeien. Verdraagt koelte beter dan basilicum."}},{herb:1,hk:"coriander",key:{ar:"كزبرة",en:"Coriander (cilantro)",fr:"Coriandre",es:"Cilantro",zh:"香菜",hi:"धनिया",pt:"Coentro",nl:"Koriander"},gen:{N:130,P:39,K:207,Ca:138,Mg:39,S:80,Fe:2.5,Mn:.5,Zn:.3,Cu:.05,B:.3,Mo:.05},veg:{N:151,P:40,K:196,Ca:142,Mg:40,S:55,Fe:2.5,Mn:.5,Zn:.3,Cu:.05,B:.3,Mo:.05},ec:"1.2–1.8",ph:"6.0–6.7",ref:"Resh 2013 · Cornell CEA",tip:{ar:"يُزهر بسرعة في الحر: أبقِ الحرارة تحت 25°م. ازرع دفعة جديدة كل 2–3 أسابيع لحصاد مستمر. خفّف النيتروجين قرب الحصاد لنكهة أفضل.",en:"Bolts quickly in heat: keep it below 25 °C. Sow a new batch every 2–3 weeks for a steady harvest. Ease off nitrogen near harvest for better flavour.",fr:"Monte vite en graines à la chaleur : restez sous 25 °C. Semez un lot toutes les 2–3 semaines. Réduisez l'azote avant la récolte pour plus d'arôme.",es:"Se espiga rápido con calor: mantenlo por debajo de 25 °C. Siembra un lote nuevo cada 2–3 semanas. Reduce el nitrógeno cerca de la cosecha para más sabor.",zh:"高温下很快抽薹：温度保持在 25 °C 以下。每 2–3 周播一批，连续采收。临近采收时减少氮肥，风味更好。",hi:"गर्मी में जल्दी फूल आ जाते हैं: तापमान 25 °C से कम रखें। लगातार कटाई के लिए हर 2–3 हफ़्ते नई बुवाई करें। कटाई के पास नाइट्रोजन कम करें।",pt:"Pendoa rápido no calor: mantenha abaixo de 25 °C. Semeie um lote novo a cada 2–3 semanas. Reduza o nitrogênio perto da colheita para mais sabor.",nl:"Schiet snel door bij warmte: houd het onder 25 °C. Zaai elke 2–3 weken een nieuwe partij. Minder stikstof vlak voor de oogst geeft meer smaak."}},{herb:1,hk:"rosemary",key:{ar:"إكليل الجبل (روزماري)",en:"Rosemary",fr:"Romarin",es:"Romero",zh:"迷迭香",hi:"रोज़मेरी",pt:"Alecrim",nl:"Rozemarijn"},gen:{N:102,P:34,K:171,Ca:128,Mg:38,S:91,Fe:2.5,Mn:.5,Zn:.3,Cu:.05,B:.3,Mo:.05},veg:{N:123,P:35,K:159,Ca:132,Mg:40,S:66,Fe:2.5,Mn:.5,Zn:.3,Cu:.05,B:.3,Mo:.05},ec:"1.0–1.6",ph:"6.0–6.5",ref:"Resh 2013 · Cornell CEA",tip:{ar:"بطيء النمو ويكره البلل الدائم: استعمل وسطاً مهوّى (بيرلايت أو حصى) وتجنّب الغمر الكامل للجذور. ابدأ من عُقل لا من بذور. يتحمل EC منخفضاً.",en:"Slow grower that hates constant wetness: use an airy medium (perlite or gravel) and avoid fully submerged roots. Start from cuttings, not seed. Prefers a low EC.",fr:"Croissance lente, déteste l'humidité permanente : substrat aéré (perlite, gravier), racines jamais immergées. Partez de boutures. Préfère une EC basse.",es:"Crece despacio y odia la humedad constante: sustrato aireado (perlita o grava), raíces nunca sumergidas del todo. Empieza con esquejes. Prefiere EC baja.",zh:"生长慢，怕长期潮湿：使用透气基质（珍珠岩或砾石），避免根系完全浸泡。用扦插苗而不是播种。适合较低 EC。",hi:"धीमी बढ़त, हमेशा गीलापन पसंद नहीं: हवादार माध्यम (परलाइट या बजरी) लें, जड़ें पूरी तरह डूबी न रहें। बीज की जगह कलम से शुरू करें। कम EC पसंद है।",pt:"Cresce devagar e detesta umidade constante: use substrato arejado (perlita ou cascalho), sem raízes totalmente submersas. Comece por estacas. Prefere EC baixa.",nl:"Groeit traag en houdt niet van constant nat: gebruik een luchtig substraat (perliet of grind), wortels nooit helemaal onder water. Begin met stekken. Liever een lage EC."}},{herb:1,hk:"oregano",key:{ar:"أوريغانو",en:"Oregano",fr:"Origan",es:"Orégano",zh:"牛至",hi:"ओरिगैनो",pt:"Orégano",nl:"Oregano"},gen:{N:109,P:35,K:183,Ca:131,Mg:39,S:91,Fe:2.5,Mn:.5,Zn:.3,Cu:.05,B:.3,Mo:.05},veg:{N:135,P:36,K:170,Ca:135,Mg:40,S:61,Fe:2.5,Mn:.5,Zn:.3,Cu:.05,B:.3,Mo:.05},ec:"1.2–1.6",ph:"6.0–6.5",ref:"Resh 2013 · Cornell CEA",tip:{ar:"النكهة أقوى مع نيتروجين أقل وضوء قوي. احصد قبيل الإزهار مباشرة حين تكون الزيوت في أعلاها. قصّ ثلث النبات فقط في كل مرة.",en:"Flavour is strongest with less nitrogen and strong light. Harvest just before flowering, when oils peak. Cut no more than a third of the plant at a time.",fr:"Arôme plus fort avec moins d'azote et beaucoup de lumière. Récoltez juste avant la floraison, au pic des huiles. Ne coupez qu'un tiers de la plante à la fois.",es:"Más sabor con menos nitrógeno y luz intensa. Cosecha justo antes de florecer, cuando los aceites están al máximo. Corta solo un tercio de la planta cada vez.",zh:"氮少、光强时香味最浓。在开花前采收，此时精油含量最高。每次只剪植株的三分之一。",hi:"कम नाइट्रोजन और तेज़ रोशनी में खुशबू सबसे ज़्यादा। फूल आने से ठीक पहले काटें, तब तेल सबसे ज़्यादा होता है। एक बार में पौधे का एक-तिहाई ही काटें।",pt:"Mais sabor com menos nitrogênio e luz forte. Colha logo antes da floração, quando os óleos estão no máximo. Corte só um terço da planta por vez.",nl:"De smaak is het sterkst met weinig stikstof en veel licht. Oogst vlak voor de bloei, als de oliën piek bereiken. Knip telkens maximaal een derde van de plant."}},{herb:1,hk:"arugula",key:{ar:"جرجير",en:"Arugula (rocket)",fr:"Roquette",es:"Rúcula",zh:"芝麻菜",hi:"अरुगुला",pt:"Rúcula",nl:"Rucola"},gen:{N:119,P:34,K:187,Ca:127,Mg:34,S:72,Fe:2.5,Mn:.5,Zn:.3,Cu:.05,B:.3,Mo:.05},veg:{N:140,P:35,K:175,Ca:131,Mg:35,S:47,Fe:2.5,Mn:.5,Zn:.3,Cu:.05,B:.3,Mo:.05},ec:"1.0–1.6",ph:"6.0–6.5",ref:"Resh 2013 · Cornell CEA",tip:{ar:"يخزّن النترات في أوراقه: قبل الحصاد بـ 3–5 أيام خفّف المحلول إلى النصف أو استبدله بماء نظيف. يحب البرودة 15–20°م ويُزهر في الحر. حصاد خلال 4–6 أسابيع.",en:"Stores nitrate in its leaves: 3–5 days before harvest, halve the solution strength or switch to plain water. Likes 15–20 °C and bolts in heat. Ready in 4–6 weeks.",fr:"Accumule les nitrates : 3–5 jours avant la récolte, diluez la solution de moitié ou passez à l'eau claire. Aime 15–20 °C, monte en graines à la chaleur. Prête en 4–6 semaines.",es:"Acumula nitratos en las hojas: 3–5 días antes de cosechar, reduce la solución a la mitad o usa agua sola. Le gustan 15–20 °C y se espiga con calor. Lista en 4–6 semanas.",zh:"叶片易积累硝酸盐：采收前 3–5 天将营养液浓度减半或改用清水。喜 15–20 °C，高温易抽薹。4–6 周可采收。",hi:"पत्तियों में नाइट्रेट जमा करता है: कटाई से 3–5 दिन पहले घोल आधा करें या सादा पानी दें। 15–20 °C पसंद है, गर्मी में फूल आ जाते हैं। 4–6 हफ़्ते में तैयार।",pt:"Acumula nitrato nas folhas: 3–5 dias antes da colheita, reduza a solução pela metade ou use só água. Gosta de 15–20 °C e pendoa no calor. Pronta em 4–6 semanas.",nl:"Slaat nitraat op in het blad: 3–5 dagen voor de oogst de oplossing halveren of alleen water geven. Houdt van 15–20 °C en schiet door bij warmte. Klaar in 4–6 weken."}},{herb:1,hk:"sage",key:{ar:"مريمية (ميرمية)",en:"Sage",fr:"Sauge",es:"Salvia",zh:"鼠尾草",hi:"सेज",pt:"Sálvia",nl:"Salie"},gen:{N:109,P:34,K:176,Ca:126,Mg:38,S:83,Fe:2.5,Mn:.5,Zn:.3,Cu:.05,B:.3,Mo:.05},veg:{N:130,P:35,K:165,Ca:130,Mg:39,S:59,Fe:2.5,Mn:.5,Zn:.3,Cu:.05,B:.3,Mo:.05},ec:"1.0–1.6",ph:"6.0–6.5",ref:"Resh 2013 · Cornell CEA",tip:{ar:"يكره الرطوبة العالية حول الجذور والأوراق: تهوية جيدة ووسط جيد التصريف. قصّ القمم ليتفرّع ويصبح كثيفاً. يفضّل EC منخفضاً إلى متوسط.",en:"Dislikes humidity around roots and leaves: good airflow and a free-draining medium. Pinch tips so it branches into a dense bush. Prefers a low-to-medium EC.",fr:"N'aime pas l'humidité autour des racines et des feuilles : bonne aération, substrat drainant.  ar:{title:"دليل الاستخدام",intro:"مساعدك الذكي للزراعة المائية: تشخيص أمراض النبات وحساب الأسمدة.",stepsT:"كيف تستخدم التطبيق",steps:["فحص المرض: من الشاشة الرئيسية اضغط 🩺 طبيب النبات، وصوّر ورقة واحدة مصابة عن قرب بإضاءة جيدة تملأ الإطار.","أكّد المحصول: يقترح التطبيق نوع النبات — اضغط ✓ نعم إن كان صحيحاً، أو ✗ لا لاختياره يدوياً (يرفع دقة التشخيص).","اقرأ التقرير: يظهر اسم المرض وشدّته والأعراض والمسبب والعلاج الكيميائي والعضوي والوقاية وطريقة الانتشار.","حاسبة الأسمدة: اضغط 🧪 لحساب خلطة N‑P‑K حسب محصولك ومرحلة نموه.","احفظ وتابع: خلطاتك وسجل الفحوصات محفوظة تلقائياً في الشاشة الرئيسية.","🌦️ الطقس والري: حدّد مدينتك ليُحسب الري من ET0 الفعلي لليوم مع تحذيرات الحر والصقيع والمطر.","📈 سجل pH و EC: سجّل قراءات المحلول وتابعها بالرسم مع نصيحة فورية عند الخروج عن المدى.","📤 شارك نتيجة التشخيص كصورة، واضغط 🔁 لتذكيرك بإعادة الفحص بعد 7 أيام.","🔍 تعرّف على النبتة: صوّر أي نبتة أو ورقة أو زهرة لتعرف اسمها الشائع والعلمي وطريقة زراعتها."],featT:"المميزات",feat:["🩺 تشخيص IPM بالذكاء الاصطناعي: أسئلة سياق (النظام/العمر/موقع الأعراض) + حتى 3 صور + فحص جودة الصورة + النوع (مرض/آفة/نقص/غير حيوي) + الاستعجال والعدوى + تشخيصات بديلة + ماذا تفعل اليوم + إجراءات زراعية + كيميائي (مادة/جرعة/فترة أمان)","📚 مكتبة أمراض وآفات بدون إنترنت: 72 مشكلة لـ 35 محصولاً بالأعراض والعلاج والوقاية","📆 المواسم الزراعية حسب الدولة/المنطقة: ماذا أبذر وأشتل وأحصد كل شهر + نصيحة المرحلة (بذر الآن، شتل بعد كذا أسبوع) + أعمال الشهر + آفات الموسم + خط زمني سنوي لكل محصول + إضافة للتقويم بضغطة","🧪 دليل خلط المبيدات: قواعد الخلط (اختبار الجرة، ترتيب الإضافة، pH الماء) + توافق 16 مجموعة مبيدات (يُخلط/بحذر/لا) مع السبب. 📐 الري محسوب بطريقة FAO-56 (ET₀ حسب منطقتك وشهرك × Kc المحصول)","📅 جدول التسميد: متى تسمّد وبماذا من يوم الزراعة (أساسي، بادئ، خضري، إزهار، إثمار، قبل الحصاد) لكل محصول ونظام + فاحص السماد: أدخل NPK أو اختر سماداً فيخبرك إن كان مناسباً للمرحلة الآن ولماذا والبديل","📈 متابعة التطور: مقارنة الفحص بالسابق (تحسّن/تدهور) + تذكير إعادة الفحص بعد 7 أيام + إحصاءات الفحوصات","🌿 اقتراح المحصول وتأكيده لرفع الدقة","💊 علاج مفصّل: كيميائي + عضوي + وقاية","💡 مقياس إضاءة يرشدك لأفضل صورة","🧪 حاسبة أسمدة N‑P‑K وموازنة المحلول","🌐 8 لغات + وضع فاتح وداكن","📊 سجل الفحوصات وخلطاتي المحفوظة","🌱 العناية بالمزروعات (35 محصولاً وشجرة من مختلف المناخات): مائية / أصص / أرض مفتوحة / أوساط — حاسبة ري (كمية وتكرار) وتسميد لكل محصول ومرحلة + ري المائية حسب الوسط + تقليم وتعليق + كتالوج أسمدة طبيعية وكيميائية + آفات ومبيدات + نقص العناصر + نصائح","🐟 أكوابونيك: حاسبة النظام + فحص وسجل الماء برسم بياني + حاسبة النمو والعلف (FCR) + دليل الأسماك","🪨 فحص التربة بالصورة: النوع والبنية والرطوبة والمادة العضوية + المحاصيل المناسبة وطرق التحسين","📅 تقويم الزراعة: سجّل موعد الزراعة ليولّد التطبيق مهام الري والتسميد والتقليم والحصاد مع إشعارات تذكير","📄 حفظ تقرير التشخيص PDF أو طباعته","☁️ مزامنة سحابية بحساب Google: نسخ احتياطي واسترجاع بياناتك على أي جهاز","📴 وضع عدم الاتصال: شارة تنبيه + عرض آخر تشخيص سحابي محفوظ"],tip:"نصيحة: صورة ورقة واحدة قريبة بإضاءة نهار = أدق تشخيص."},
 en:{title:"User Guide",intro:"Your smart hydroponics assistant: plant disease diagnosis and fertilizer calculation.",stepsT:"How to use the app",steps:["Scan a disease: from Home tap 🩺 Plant Doctor and photograph one affected leaf close-up in good light, filling the frame.","Confirm the crop: the app suggests the plant type — tap ✓ Yes if correct, or ✗ No to pick it manually (raises accuracy).","Read the report: disease name, severity, symptoms, cause, chemical & organic treatment, prevention and spread.","Fertilizer calculator: tap 🧪 to compute an N‑P‑K mix for your crop and growth stage.","Save & track: your mixes and scan history are stored automatically on Home.","🌦️ Weather & irrigation: set your city so watering uses today's real ET0, with heat, frost and rain alerts.","📈 pH & EC log: record solution readings, see the trend chart and get instant advice when out of range.","📤 Share a diagnosis as an image, and tap 🔁 to be reminded to re-check in 7 days.","🔍 Identify a plant: photograph any plant, leaf or flower to get its common and scientific name and how to grow it."],featT:"Features",feat:["🩺 AI IPM diagnosis: context questions (system/age/where) + up to 3 photos + photo-quality check + type (disease/pest/deficiency/abiotic) + urgency & contagion + alternative diagnoses + what to do today + cultural steps + chemical (active/dose/PHI)","📚 Offline disease & pest library: 72 problems for 35 crops with symptoms, treatment and prevention","📆 Planting seasons by country/area: what to sow, transplant and harvest each month + stage advice (sow now, transplant in N weeks) + month works + seasonal pest watch + yearly timeline per crop + one-tap add to calendar","🧪 Tank-mix guide: mixing rules (jar test, order of addition, water pH) + compatibility of 16 pesticide groups (ok/caution/no) with reasons. 📐 Irrigation computed by FAO-56 (ET₀ for your region & month × crop Kc)","📅 Feeding schedule: when to feed and with what from planting day (base, starter, vegetative, flowering, fruiting, pre-harvest) per crop and system + fertilizer checker: enter an NPK or pick a fertilizer and it tells you if it suits the current stage, why, and the better choice","📈 Progress tracking: compare with the previous scan (better/worse) + 7-day re-scan reminder + scan statistics","🌿 Crop suggestion & confirmation for accuracy","💊 Detailed treatment: chemical + organic + prevention","💡 Light meter guiding the best photo","🧪 N‑P‑K fertilizer calculator & solution balance","🌐 8 languages + light/dark mode","📊 Scan history & saved mixes","🌱 Plant Care (35 crops & trees from all climates): hydro / pots / open field / substrate — irrigation calculator (volume & frequency) and feeding per crop/stage + hydro schedule by medium + pruning & training + natural/chemical fertilizer catalogue + pests & pesticides + deficiencies + tips","🐟 Aquaponics: system calculator + water check & charted log + growth/feed (FCR) + fish guide","🪨 Soil scan from a photo: type, structure, moisture, organic matter + suitable crops and how to improve","📅 Grow calendar: log the planting date and get watering, feeding, pruning and harvest tasks with reminder notifications","📄 Save the diagnosis report as PDF or print it","☁️ Cloud sync with your Google account: back up and restore your data on any device","📴 Offline mode: warning badge + last cached cloud diagnosis"],tip:"Tip: one close leaf in daylight = most accurate diagnosis."},
 fr:{title:"Guide d'utilisation",intro:"Votre assistant hydroponique intelligent : diagnostic des maladies et calcul d'engrais.",stepsT:"Comment utiliser l'app",steps:["Analyser une maladie : sur l'accueil, touchez 🩺 Docteur des plantes, photographiez une feuille atteinte de près, bien éclairée.","Confirmer la culture : l'app propose la plante — ✓ Oui si correct, ✗ Non pour la choisir (améliore la précision).","Lire le rapport : maladie, gravité, symptômes, cause, traitement chimique et bio, prévention, propagation.","Calculateur d'engrais : touchez 🧪 pour un mélange N‑P‑K selon la culture et le stade.","Enregistrer : mélanges et historique sauvegardés sur l'accueil.","🌦️ Météo & irrigation : indiquez votre ville pour arroser selon l'ET0 réelle du jour, avec alertes chaleur/gel/pluie.","📈 Journal pH & EC : notez vos mesures, suivez la courbe et recevez un conseil immédiat hors plage.","📤 Partagez un diagnostic en image et touchez 🔁 pour un rappel de revérification à 7 jours.","🔍 Identifier une plante : photographiez une plante, feuille ou fleur pour connaître son nom et sa culture."],featT:"Fonctionnalités",feat:["🩺 Diagnostic IPM par IA : questions de contexte (système/âge/localisation) + jusqu'à 3 photos + contrôle qualité photo + type (maladie/ravageur/carence/abiotique) + urgence et contagion + diagnostics alternatifs + quoi faire aujourd'hui + mesures culturales + chimique (matière/dose/DAR)","📚 Bibliothèque maladies et ravageurs hors ligne : 72 problèmes pour 35 cultures avec symptômes, traitement et prévention","📆 Calendrier des semis par pays/zone : quoi semer, repiquer et récolter chaque mois + conseils d'étape + travaux du mois + ravageurs de saison + frise annuelle par culture + ajout au calendrier en un geste","🧪 Guide des mélanges : règles (test du bocal, ordre d'ajout, pH) + compatibilité de 16 groupes (ok/prudence/non) avec motifs. 📐 Irrigation calculée selon FAO-56 (ET₀ région/mois × Kc)","📅 Calendrier de fertilisation : quand et avec quoi depuis la plantation (fond, starter, végétatif, floraison, fructification, pré-récolte) par culture et système + vérificateur d'engrais : saisissez un NPK ou choisissez un engrais et l'app dit s'il convient au stade actuel, pourquoi, et le meilleur choix","📈 Suivi de l'évolution : comparaison avec le scan précédent (mieux/pire) + rappel de re-scan à 7 jours + statistiques des scans","🌿 Suggestion et confirmation de culture","💊 Traitement détaillé : chimique + bio + prévention","💡 Posemètre pour la meilleure photo","🧪 Calculateur d'engrais N‑P‑K","🌐 8 langues + clair/sombre","📊 Historique et mélanges","🌱 Soins (35 cultures et arbres) : hydro / pots / plein champ / substrat — calculateur d'irrigation et fertilisation par culture/stade + hydro par substrat + taille + catalogue d'engrais + ravageurs + carences + conseils","🐟 Aquaponie : calculateur + contrôle et journal de l'eau + croissance/aliment (FCR) + guide","🪨 Analyse du sol par photo : type, structure, humidité, matière organique + cultures adaptées et améliorations","📅 Calendrier de culture : date de plantation → tâches d'arrosage, fertilisation, taille et récolte avec rappels","📄 Rapport de diagnostic en PDF / impression","☁️ Synchronisation cloud (compte Google) : sauvegarde et restauration sur tout appareil","📴 Mode hors ligne : badge d'alerte + dernier diagnostic en cache"],tip:"Astuce : une feuille de près en plein jour = diagnostic plus précis."},
 es:{title:"Guía de uso",intro:"Tu asistente inteligente de hidroponía: diagnóstico de enfermedades y cálculo de fertilizantes.",stepsT:"Cómo usar la app",steps:["Analizar enfermedad: en Inicio pulsa 🩺 Doctor de plantas y fotografía una hoja afectada de cerca con buena luz.","Confirmar cultivo: la app sugiere la planta — ✓ Sí si es correcto, ✗ No para elegirla (mejora la precisión).","Leer el informe: enfermedad, gravedad, síntomas, causa, tratamiento químico y orgánico, prevención y propagación.","Calculadora de fertilizantes: pulsa 🧪 para una mezcla N‑P‑K según cultivo y etapa.","Guardar: mezclas e historial se guardan en Inicio.","🌦️ Clima y riego: indica tu ciudad para regar según la ET0 real de hoy, con alertas de calor, helada y lluvia.","📈 Registro pH y EC: anota lecturas, mira la gráfica y recibe consejos al salir de rango.","📤 Comparte un diagnóstico como imagen y pulsa 🔁 para revisar de nuevo en 7 días.","🔍 Identificar planta: fotografía una planta, hoja o flor para saber su nombre y cómo cultivarla."],featT:"Funciones",feat:["🩺 Diagnóstico IPM con IA: preguntas de contexto (sistema/edad/dónde) + hasta 3 fotos + control de calidad de foto + tipo (enfermedad/plaga/carencia/abiótico) + urgencia y contagio + diagnósticos alternativos + qué hacer hoy + medidas culturales + químico (materia/dosis/plazo de seguridad)","📚 Biblioteca de enfermedades y plagas sin conexión: 72 problemas de 35 cultivos con síntomas, tratamiento y prevención","📆 Calendario de siembra por país/zona: qué sembrar, trasplantar y cosechar cada mes + consejos de etapa + labores del mes + plagas de temporada + cronograma anual por cultivo + añadir al calendario con un toque","🧪 Guía de mezclas: reglas (prueba de frasco, orden de adición, pH) + compatibilidad de 16 grupos (ok/precaución/no) con motivos. 📐 Riego calculado según FAO-56 (ET₀ región/mes × Kc)","📅 Calendario de abonado: cuándo y con qué desde la siembra (fondo, arranque, vegetativo, floración, fructificación, precosecha) por cultivo y sistema + verificador de abonos: escribe un NPK o elige un abono y te dice si conviene en la etapa actual, por qué, y la mejor opción","📈 Seguimiento: comparación con el escaneo anterior (mejor/peor) + recordatorio de re-escaneo a 7 días + estadísticas de escaneos","🌿 Sugerencia y confirmación de cultivo","💊 Tratamiento detallado: químico + orgánico + prevención","💡 Fotómetro para la mejor foto","🧪 Calculadora de fertilizantes N‑P‑K","🌐 8 idiomas + modo claro/oscuro","📊 Historial y mezclas","🌱 Cuidado (35 cultivos y árboles): hidro / macetas / campo / sustrato — calculadora de riego y nutrición por cultivo/etapa + hidro por sustrato + poda + catálogo de fertilizantes + plagas + carencias + consejos","🐟 Acuaponía: calculadora + control y registro del agua + crecimiento/alimento (FCR) + guía","🪨 Análisis de suelo por foto: tipo, estructura, humedad, materia orgánica + cultivos adecuados y mejoras","📅 Calendario de cultivo: fecha de siembra → tareas de riego, abonado, poda y cosecha con recordatorios","📄 Informe de diagnóstico en PDF / impresión","☁️ Sincronización en la nube (cuenta Google): respaldo y restauración en cualquier dispositivo","📴 Modo sin conexión: aviso + último diagnóstico guardado"],tip:"Consejo: una hoja de cerca a la luz del día = diagnóstico más preciso."},
 zh:{title:"使用指南",intro:"您的智能水培助手：植物病害诊断与肥料计算。",stepsT:"如何使用",steps:["扫描病害：在主页点击 🩺 植物医生，在良好光线下近距离拍摄一片病叶，充满画面。","确认作物：应用会建议植物类型 — 正确点 ✓ 是，否则点 ✗ 否手动选择（提高准确度）。","查看报告：病名、严重程度、症状、病因、化学与有机治疗、预防和传播方式。","肥料计算器：点击 🧪 按作物和生长阶段计算 N‑P‑K 配方。","保存跟踪：配方和扫描记录自动保存在主页。","🌦️ 天气与灌溉：设置城市，按当天真实 ET0 计算灌溉，并提供高温、霜冻和降雨预警。","📈 pH/EC 记录：记录营养液读数，查看趋势图，超出范围时立即获得建议。","📤 以图片分享诊断结果，点 🔁 在 7 天后提醒复查。","🔍 识别植物：拍摄任意植物、叶或花，获取俗名、学名和种植方法。"],featT:"功能",feat:["🩺 AI 综合防治（IPM）诊断：情境问题（系统/苗龄/部位）+ 最多3张照片 + 照片质量检查 + 类型（病害/虫害/缺素/非生物）+ 紧急程度与传染性 + 备选诊断 + 今日措施 + 农艺措施 + 化学防治（有效成分/剂量/安全间隔）","📚 离线病虫害图库：35种作物72种问题，含症状、防治与预防","📆 按国家/地区的种植季节：每月播种、移栽、收获 + 阶段建议（现在播种，N周后移栽）+ 本月农事 + 季节病虫害 + 每种作物全年时间线 + 一键加入日历","🧪 桶混指南：混用规则（罐试验、加入顺序、水pH）+ 16类农药相容性（可/慎/禁）及原因。📐 灌溉按FAO-56计算（地区月份ET₀ × 作物Kc）","📅 施肥计划：自定植日起何时施、施什么（基肥、启动肥、营养期、开花、结果、采前）按作物和系统 + 肥料检查器：输入NPK或选择肥料，告诉你是否适合当前阶段、原因及更佳选择","📈 进展跟踪：与上次扫描对比（好转/恶化）+ 7天复查提醒 + 扫描统计","🌿 作物建议与确认以提高准确度","💊 详细治疗：化学 + 有机 + 预防","💡 光线计帮助拍出最佳照片","🧪 N‑P‑K 肥料计算器","🌐 8 种语言 + 浅色/深色","📊 扫描记录与配方","🌱 作物养护（35 种作物与果树）：水培/盆栽/露地/基质 — 灌溉计算器（量与频率）与按作物/阶段施肥 + 按介质水培灌溉 + 整枝绑蔓 + 天然/化学肥料目录 + 病虫害 + 缺素 + 建议","🐟 鱼菜共生：系统计算 + 水质检查与图表记录 + 生长/投喂（FCR）+ 鱼类指南","🪨 拍照土壤检测：类型、结构、湿度、有机质 + 适宜作物与改良方法","📅 种植日历：记录定植日期，自动生成浇水、施肥、修剪、收获任务并提醒","📄 诊断报告保存为 PDF / 打印","☁️ 云同步（Google 账号）：在任何设备备份与恢复数据","📴 离线模式：提示标志 + 上次缓存的云端诊断"],tip:"提示：白天近拍一片叶子 = 最准确诊断。"},
 hi:{title:"उपयोग गाइड",intro:"आपका स्मार्ट हाइड्रोपोनिक्स सहायक: पौध रोग निदान और उर्वरक गणना।",stepsT:"ऐप कैसे उपयोग करें",steps:["रोग स्कैन: होम से 🩺 पौधा डॉक्टर दबाएँ, अच्छी रोशनी में एक प्रभावित पत्ती को पास से फोटो लें।","फसल पुष्टि: ऐप पौधा सुझाता है — सही हो तो ✓ हाँ, वरना ✗ नहीं से चुनें (सटीकता बढ़ती है)।","रिपोर्ट पढ़ें: रोग, गंभीरता, लक्षण, कारण, रासायनिक व जैविक उपचार, रोकथाम और फैलाव।","उर्वरक कैलकुलेटर: 🧪 दबाकर फसल व अवस्था अनुसार N‑P‑K मिश्रण।","सहेजें: मिश्रण व स्कैन इतिहास होम पर सुरक्षित।","🌦️ मौसम व सिंचाई: शहर चुनें ताकि सिंचाई आज के असली ET0 से हो, गर्मी/पाला/बारिश चेतावनी सहित।","📈 pH व EC लॉग: घोल की रीडिंग दर्ज करें, ग्राफ़ देखें और सीमा से बाहर होने पर तुरंत सलाह पाएँ।","📤 निदान को छवि के रूप में साझा करें, और 7 दिन बाद दोबारा जाँच के लिए 🔁 दबाएँ।","🔍 पौधे की पहचान: किसी पौधे, पत्ती या फूल की फोटो लें और उसका नाम व उगाने का तरीका जानें।"],featT:"विशेषताएँ",feat:["🩺 AI IPM निदान: संदर्भ प्रश्न (प्रणाली/आयु/स्थान) + 3 तक फ़ोटो + फ़ोटो गुणवत्ता जाँच + प्रकार (रोग/कीट/कमी/अजैविक) + तात्कालिकता व संक्रामकता + वैकल्पिक निदान + आज क्या करें + कृषि उपाय + रासायनिक (सक्रिय तत्व/मात्रा/PHI)","📚 ऑफ़लाइन रोग व कीट पुस्तकालय: 35 फसलों की 72 समस्याएँ लक्षण, उपचार व रोकथाम के साथ","📆 देश/क्षेत्र अनुसार बुवाई मौसम: हर महीने क्या बोएँ, रोपें, काटें + चरण सलाह + महीने के काम + मौसमी कीट + हर फसल की वार्षिक समय-रेखा + एक टैप में कैलेंडर में जोड़ें","🧪 टैंक-मिक्स गाइड: नियम (जार टेस्ट, क्रम, pH) + 16 समूहों की अनुकूलता (ठीक/सावधानी/नहीं) कारण सहित। 📐 सिंचाई FAO-56 से (क्षेत्र-माह ET₀ × फसल Kc)","📅 खाद अनुसूची: रोपण दिन से कब और कौन-सी खाद (बुनियादी, स्टार्टर, वानस्पतिक, फूल, फल, कटाई-पूर्व) हर फसल व प्रणाली के लिए + खाद जाँचक: NPK लिखें या खाद चुनें, यह बताता है कि अभी की अवस्था के लिए उपयुक्त है या नहीं, क्यों, और बेहतर विकल्प","📈 प्रगति ट्रैकिंग: पिछले स्कैन से तुलना (सुधार/बिगड़ाव) + 7 दिन बाद पुनः-स्कैन रिमाइंडर + स्कैन आँकड़े","🌿 फसल सुझाव व पुष्टि","💊 विस्तृत उपचार: रासायनिक + जैविक + रोकथाम","💡 सर्वोत्तम फोटो हेतु लाइट मीटर","🧪 N‑P‑K उर्वरक कैलकुलेटर","🌐 8 भाषाएँ + हल्का/गहरा","📊 स्कैन इतिहास व मिश्रण","🌱 फसल देखभाल (35 फसलें व पेड़): हाइड्रो/गमले/खेत/सब्सट्रेट — सिंचाई कैलकुलेटर व फसल/अवस्था अनुसार पोषण + माध्यम अनुसार हाइड्रो + छंटाई + प्राकृतिक/रासायनिक उर्वरक सूची + कीट + कमी + सुझाव","🐟 एक्वापोनिक्स: सिस्टम कैलकुलेटर + जल जाँच व चार्ट लॉग + वृद्धि/चारा (FCR) + मछली गाइड","🪨 फ़ोटो से मिट्टी जाँच: प्रकार, बनावट, नमी, जैविक पदार्थ + उपयुक्त फसलें व सुधार","📅 खेती कैलेंडर: रोपण तिथि दर्ज करें → सिंचाई, खाद, छँटाई व कटाई कार्य रिमाइंडर सहित","📄 निदान रिपोर्ट PDF सहेजें / प्रिंट","☁️ क्लाउड सिंक (Google खाता): किसी भी डिवाइस पर बैकअप व पुनर्स्थापना","📴 ऑफ़लाइन मोड: चेतावनी बैज + पिछला सहेजा क्लाउड निदान"],tip:"सुझाव: दिन के उजाले में एक पत्ती का नज़दीकी फोटो = सबसे सटीक।"},
 pt:{title:"Guia de uso",intro:"Seu assistente inteligente de hidroponia: diagnóstico de doenças e cálculo de fertilizantes.",stepsT:"Como usar o app",steps:["Analisar doença: na tela inicial toque 🩺 Médico de plantas e fotografe uma folha afetada de perto com boa luz.","Confirmar cultura: o app sugere a planta — ✓ Sim se correto, ✗ Não para escolher (aumenta a precisão).","Ler o relatório: doença, gravidade, sintomas, causa, tratamento químico e orgânico, prevenção e propagação.","Calculadora de fertilizantes: toque 🧪 para uma mistura N‑P‑K por cultura e estágio.","Salvar: misturas e histórico ficam na tela inicial.","🌦️ Clima e irrigação: defina sua cidade para regar pela ET0 real do dia, com alertas de calor, geada e chuva.","📈 Registro pH e EC: anote leituras, veja o gráfico e receba dicas imediatas fora da faixa.","📤 Compartilhe um diagnóstico como imagem e toque 🔁 para reavaliar em 7 dias.","🔍 Identificar planta: fotografe uma planta, folha ou flor para saber o nome e como cultivar."],featT:"Recursos",feat:["🩺 Diagnóstico IPM com IA: perguntas de contexto (sistema/idade/onde) + até 3 fotos + verificação de qualidade da foto + tipo (doença/praga/deficiência/abiótico) + urgência e contágio + diagnósticos alternativos + o que fazer hoje + medidas culturais + químico (ativo/dose/carência)","📚 Biblioteca offline de doenças e pragas: 72 problemas de 35 culturas com sintomas, tratamento e prevenção","📆 Épocas de plantio por país/região: o que semear, transplantar e colher a cada mês + dicas de etapa + trabalhos do mês + pragas da época + cronograma anual por cultura + adicionar ao calendário com um toque","🧪 Guia de misturas: regras (teste do frasco, ordem, pH) + compatibilidade de 16 grupos (ok/cautela/não) com motivos. 📐 Irrigação pelo FAO-56 (ET₀ região/mês × Kc)","📅 Calendário de adubação: quando e com o quê desde o plantio (base, arranque, vegetativo, floração, frutificação, pré-colheita) por cultura e sistema + verificador de adubos: digite um NPK ou escolha um adubo e ele diz se serve para a fase atual, por quê, e a melhor opção","📈 Acompanhamento: comparação com o exame anterior (melhor/pior) + lembrete de novo exame em 7 dias + estatísticas dos exames","🌿 Sugestão e confirmação de cultura","💊 Tratamento detalhado: químico + orgânico + prevenção","💡 Fotômetro para a melhor foto","🧪 Calculadora de fertilizantes N‑P‑K","🌐 8 idiomas + claro/escuro","📊 Histórico e misturas","🌱 Cuidados (35 culturas e árvores): hidro / vasos / campo / substrato — calculadora de irrigação e nutrição por cultura/fase + hidro por substrato + poda + catálogo de fertilizantes + pragas + carências + dicas","🐟 Aquaponia: calculadora + controle e registro da água + crescimento/ração (FCR) + guia","🪨 Análise do solo por foto: tipo, estrutura, umidade, matéria orgânica + culturas adequadas e melhorias","📅 Calendário de cultivo: data de plantio → tarefas de rega, adubação, poda e colheita com lembretes","📄 Relatório de diagnóstico em PDF / impressão","☁️ Sincronização na nuvem (conta Google): backup e restauração em qualquer aparelho","📴 Modo offline: aviso + último diagnóstico em cache"],tip:"Dica: uma folha de perto à luz do dia = diagnóstico mais preciso."},
 nl:{title:"Gebruikshandleiding",intro:"Je slimme hydrocultuur-assistent: plantziektediagnose en mestberekening.",stepsT:"Hoe de app te gebruiken",steps:["Ziekte scannen: tik op Home op 🩺 Plantendokter en fotografeer één aangetast blad van dichtbij met goed licht.","Gewas bevestigen: de app stelt de plant voor — ✓ Ja als het klopt, ✗ Nee om te kiezen (verhoogt nauwkeurigheid).","Lees het rapport: ziekte, ernst, symptomen, oorzaak, chemische en biologische behandeling, preventie en verspreiding.","Mestcalculator: tik op 🧪 voor een N‑P‑K-mengsel per gewas en groeifase.","Opslaan: mengsels en scangeschiedenis staan op Home.","🌦️ Weer & water: stel je stad in zodat water geven de echte ET0 van vandaag gebruikt, met hitte-, vorst- en regenwaarschuwingen.","📈 pH- & EC-logboek: noteer metingen, bekijk de grafiek en krijg direct advies buiten bereik.","📤 Deel een diagnose als afbeelding en tik 🔁 voor een herinnering over 7 dagen.","🔍 Plant herkennen: fotografeer een plant, blad of bloem voor de naam en teeltinfo."],featT:"Functies",feat:["🩺 AI IPM-diagnose: contextvragen (systeem/leeftijd/waar) + tot 3 foto's + fotokwaliteitscontrole + type (ziekte/plaag/gebrek/abiotisch) + urgentie en besmettelijkheid + alternatieve diagnoses + wat vandaag te doen + teeltmaatregelen + chemisch (werkzame stof/dosis/wachttijd)","📚 Offline ziekte- en plaagbibliotheek: 72 problemen voor 35 gewassen met symptomen, behandeling en preventie","📆 Zaaikalender per land/gebied: wat elke maand zaaien, uitplanten en oogsten + fase-advies + werkzaamheden + seizoensplagen + jaaroverzicht per gewas + met één tik toevoegen aan de kalender","🧪 Tankmix-gids: regels (jartest, volgorde, water-pH) + verenigbaarheid van 16 middelgroepen (ok/voorzichtig/nee) met reden. 📐 Irrigatie volgens FAO-56 (ET₀ regio/maand × gewas-Kc)","📅 Bemestingsschema: wanneer en waarmee vanaf de plantdag (basis, start, vegetatief, bloei, vruchtdracht, vóór oogst) per gewas en systeem + meststofcontrole: typ een NPK of kies een meststof en de app zegt of die past bij het huidige stadium, waarom, en de betere keuze","📈 Voortgang volgen: vergelijking met de vorige scan (beter/slechter) + herinnering om na 7 dagen opnieuw te scannen + scanstatistieken","🌿 Gewassuggestie en bevestiging","💊 Gedetailleerde behandeling: chemisch + biologisch + preventie","💡 Lichtmeter voor de beste foto","🧪 N‑P‑K-mestcalculator","🌐 8 talen + licht/donker","📊 Scangeschiedenis en mengsels","🌱 Gewasverzorging (35 gewassen en bomen): hydro / potten / vollegrond / substraat — irrigatiecalculator en voeding per gewas/fase + hydro per substraat + snoei + meststoffencatalogus + plagen + gebreken + tips","🐟 Aquaponics: systeemcalculator + watercheck & grafieklog + groei/voer (FCR) + visgids","🪨 Bodemscan via foto: type, structuur, vocht, organische stof + geschikte gewassen en verbeteringen","📅 Teeltkalender: plantdatum → taken voor water, voeding, snoei en oogst met herinneringen","📄 Diagnoserapport opslaan als PDF / afdrukken","☁️ Cloudsync (Google-account): back-up en herstel op elk apparaat","📴 Offline-modus: waarschuwing + laatste opgeslagen clouddiagnose"],tip:"Tip: één blad van dichtbij bij daglicht = nauwkeurigste diagnose."}
